name: Keep Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "Error: APP_URL secret is not set"
            echo "Please add APP_URL secret in GitHub repository settings"
            exit 1
          fi
          
          echo "Pinging app at: $APP_URL"
          response=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/health")
          
          if [ "$response" -eq 200 ]; then
            echo "✅ App is alive (HTTP $response)"
          else
            echo "❌ App returned HTTP $response"
            exit 1
          fi
